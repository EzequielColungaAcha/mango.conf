# DWM-like MangoWM base config
# Generated from /home/ezziel/dwmToMangoWM.

# Basic appearance
gappih=5
gappiv=5
gappoh=10
gappov=10
borderpx=2
rootcolor=0x201b14ff
bordercolor=0x444444ff
focuscolor=0xc9b890ff
urgentcolor=0xad401fff
globalcolor=0xb153a7ff
scratchpadcolor=0x516c93ff
overlaycolor=0x14a57cff
dropcolor=0x8FBA7C55
splitcolor=0xEB441EFF
maximizescreencolor=0x89aa61ff
focused_opacity=1.0
unfocused_opacity=1.0
border_radius=0
no_radius_when_single=1
shadows=0
layer_shadows=0
blur=0
blur_layer=0

# Layout behavior
new_is_master=1
default_mfact=0.55
default_nmaster=1
smartgaps=0
center_master_overspread=0
center_when_single_stack=1
circle_layout=tile,fair,center_tile

# Mouse/tile interaction
drag_tile_to_tile=1
drag_tile_small=1
enable_floating_snap=1
snap_distance=30
sloppyfocus=1
warpcursor=1
focus_on_activate=1
focus_cross_monitor=0
focus_cross_tag=0

# Overview
hotarea_size=10
enable_hotarea=0
ov_tab_mode=1
ov_no_resize=1
overviewgappi=5
overviewgappo=30

# Keyboard and pointer basics
repeat_rate=25
repeat_delay=600
numlockon=0
xkb_rules_layout=us
tap_to_click=1
tap_and_drag=1
drag_lock=1
disable_while_typing=1
mouse_natural_scrolling=0
trackpad_natural_scrolling=0
cursor_size=24

# Tags default to DWM-like tile layout.
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# Basic utility bindings
bind=SUPER,r,reload_config
bind=ALT,Return,spawn,foot
bind=ALT,space,spawn,rofi -show drun
bind=ALT,q,killclient
bind=SUPER,m,quit

# DWM-style tag switching: Alt + number.
bind=ALT,1,view,1,0
bind=ALT,2,view,2,0
bind=ALT,3,view,3,0
bind=ALT,4,view,4,0
bind=ALT,5,view,5,0
bind=ALT,6,view,6,0
bind=ALT,7,view,7,0
bind=ALT,8,view,8,0
bind=ALT,9,view,9,0

# DWM-style send focused window to tag: Alt + Shift + number.
bind=ALT+SHIFT,1,tag,1,0
bind=ALT+SHIFT,2,tag,2,0
bind=ALT+SHIFT,3,tag,3,0
bind=ALT+SHIFT,4,tag,4,0
bind=ALT+SHIFT,5,tag,5,0
bind=ALT+SHIFT,6,tag,6,0
bind=ALT+SHIFT,7,tag,7,0
bind=ALT+SHIFT,8,tag,8,0
bind=ALT+SHIFT,9,tag,9,0

# Focus and stack movement helpers
bind=ALT,Left,focusdir,left
bind=ALT,Right,focusdir,right
bind=ALT,Up,focusdir,up
bind=ALT,Down,focusdir,down
bind=ALT+SHIFT,Left,exchange_client,left
bind=ALT+SHIFT,Right,exchange_client,right
bind=ALT+SHIFT,Up,exchange_client,up
bind=ALT+SHIFT,Down,exchange_client,down

# Requested DWM-like window states
bind=ALT,F,togglefloating
bind=ALT+SHIFT,F,togglefakefullscreen
bind=ALT,0,toggleoverview,0
bind=ALT,S,toggleglobal
bind=ALT,H,minimized

# Mango restores minimized windows one at a time from its scratchpad.
bind=ALT+SHIFT,S,restore_minimized

# Requested DWM-like layouts
bind=ALT,D,setlayout,fair
bind=ALT,T,setlayout,tile
bind=ALT,R,setlayout,center_tile

# Mouse drag behavior:
# Alt + left drag moves/reorders windows; Alt + right drag resizes.
mousebind=ALT,btn_left,moveresize,curmove
mousebind=ALT,btn_right,moveresize,curresize

# Optional scroll navigation between occupied tags.
axisbind=ALT,UP,viewtoleft_have_client,0
axisbind=ALT,DOWN,viewtoright_have_client,0
