# Basic utility bindings
bind=SUPER,r,reload_config
bind=ALT,Return,spawn,alacritty
bind=ALT,space,spawn,rofi_all_apps
bind=ALT,q,killclient
bind=SUPER,m,quit

# DWM-style tag switching: Alt + number.
bind=ALT,1,view,1,0
bind=ALT,2,view,2,0
bind=ALT,3,view,3,0
bind=ALT,4,view,4,0
bind=ALT,5,view,5,0
bind=ALT,6,view,6,0
bind=ALT,7,view,7,0
bind=ALT,8,view,8,0
bind=ALT,9,view,9,0

# DWM-style send focused window to tag: Alt + Shift + number.
bind=ALT+SHIFT,1,tag,1,0
bind=ALT+SHIFT,2,tag,2,0
bind=ALT+SHIFT,3,tag,3,0
bind=ALT+SHIFT,4,tag,4,0
bind=ALT+SHIFT,5,tag,5,0
bind=ALT+SHIFT,6,tag,6,0
bind=ALT+SHIFT,7,tag,7,0
bind=ALT+SHIFT,8,tag,8,0
bind=ALT+SHIFT,9,tag,9,0

# Focus and stack movement helpers
bind=ALT,Left,focusdir,left
bind=ALT,Right,focusdir,right
bind=ALT,Up,focusdir,up
bind=ALT,Down,focusdir,down
bind=ALT+SHIFT,Left,exchange_client,left
bind=ALT+SHIFT,Right,exchange_client,right
bind=ALT+SHIFT,Up,exchange_client,up
bind=ALT+SHIFT,Down,exchange_client,down

# Requested DWM-like window states
bind=ALT,F,togglefloating
bind=ALT+SHIFT,F,togglemaximizescreen
bind=ALT,0,toggleoverview,0
bind=ALT,S,toggleglobal
bind=ALT,H,minimized
bind=ALT,A,spawn,rofi_all_apps
bind=NONE,XF86AudioMute,spawn,volume --toggle
bind=NONE,XF86AudioLowerVolume,spawn,volume --dec
bind=NONE,XF86AudioRaiseVolume,spawn,volume --inc
bind=NONE,XF86AudioMicMute,spawn,volume --toggle-mic

bind=Print,spawn,flameshot gui
bind=ALT+SHIFT,Return,spawn,wallpaperChangeWayland
bind=ALT+CTRL,Return,spawn,chooseWallpaperWayland
bind=ALT+SHIFT+CTRL,X,spawn,rofi_powermenu
bind=ALT+SHIFT,X,spawn,actionsMenu

# Mango restores minimized windows one at a time from its scratchpad.
bind=ALT+SHIFT,S,restore_minimized

# Requested DWM-like layouts
bind=ALT,D,setlayout,fair
bind=ALT,T,setlayout,tile
bind=ALT,R,setlayout,center_tile

# Mouse drag behavior:
# Alt + left drag moves/reorders windows; Alt + right drag resizes.
mousebind=ALT,btn_left,moveresize,curmove
mousebind=ALT,btn_right,moveresize,curresize

# Optional scroll navigation between occupied tags.
axisbind=ALT,UP,viewtoleft_have_client,0
axisbind=ALT,DOWN,viewtoright_have_client,0