# --- Tag assignments ---

windowrule=tags:9,appid:^google-chrome-guest$

windowrule=tags:3,appid:^google-chrome$

windowrule=tags:1,appid:Alacritty

windowrule=tags:2,appid:cursor
windowrule=tags:2,appid:Code

windowrule=tags:4,appid:Slack

windowrule=tags:5,appid:pcmanfm
windowrule=tags:5,appid:thunar
windowrule=tags:5,appid:org.gnome.Nautilus
windowrule=tags:5,appid:dolphin
windowrule=tags:5,appid:nemo

windowrule=tags:7,appid:steam

# Keep compositor idle inhibited while these windows are focused (video, browsers)
windowrule=idleinhibit_when_focus:1,appid:^google-chrome$
windowrule=idleinhibit_when_focus:1,appid:^google-chrome-guest$
windowrule=idleinhibit_when_focus:1,appid:chromium
windowrule=idleinhibit_when_focus:1,appid:firefox
windowrule=idleinhibit_when_focus:1,appid:mpv
windowrule=idleinhibit_when_focus:1,appid:vlc
windowrule=idleinhibit_when_focus:1,title:^(.*YouTube.*|.*Netflix.*|.*Twitch.*)$
